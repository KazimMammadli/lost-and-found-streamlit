[tool.pytest.ini_options]
# All tests live in tests/ — including the provided AI smoke tests
testpaths = ["tests"]

# Make 'ai' (root-level package) and 'src' importable without installing
pythonpath = ["."]

# All async test functions are automatically treated as coroutines
asyncio_mode = "auto"

# Show all passing/failing tests verbosely
addopts = "-v --tb=short"


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"ui/*.py" = ["E402"]


[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
exclude = ["ai/providers/"]

[[tool.mypy.overrides]]
module = "ai.providers.*"
ignore_errors = true
